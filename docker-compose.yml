# Separate network for each node.
networks:
  cluster_network:
    driver: bridge
  node_a_internal:
    internal: true
  node_b_internal:
    internal: true
  node_c_internal:
    internal: true
  node_d_internal:
    internal: true

# Separate volumes to avoid SQLite database conflicts.
volumes:
  bis_data_a:
  bis_data_b:
  bis_data_c:
  bis_data_d:

services:
 # NODO A (Onesto)
  python_validator_a:
    build: 
      context: ./Server_Python
    container_name: bis_api_server_a # Nome univoco
    env_file:
      - ./.env
      - ./Server_Python/.env
    environment:
      - NODE_ID=node_a
      - VALIDATOR_PRIVATE_KEY=${NODE_A_PRIVATE_KEY}
      - VALIDATOR_PUBLIC_KEYS=${VALIDATOR_PUBLIC_KEYS}
      - SERVER_SIGN_PRIVATE_KEY=${NODE_A_PRIVATE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ELIXIR_HOST=node_a
      - ELIXIR_HTTP_PORT=6000
    volumes:
      - bis_data_a:/data # volume univoco per il nodo A
    ports:
      - "127.0.0.1:8001:8000"
    restart: unless-stopped
    networks:
      node_a_internal:
        aliases:
          - python_validator
      cluster_network:

  node_a:
    build: ./Server_MessagerNode
    environment:
      - NODE_ID=node_a
      - PYTHON_HOST=python_validator 
      - PYTHON_PORT=8000 
      - ELIXIR_HTTP_PORT=6000
      - PEERS=node_b:4000,node_c:4000,node_d:4000
    depends_on:
      - python_validator_a
    restart: unless-stopped
    networks:
      - node_a_internal
      - cluster_network
    
 
  # NODO B (Onesto)
  python_validator_b:
    build: 
      context: ./Server_Python
    container_name: bis_api_server_b # Nome univoco
    env_file:
      - ./.env
      - ./Server_Python/.env
    environment:
      - NODE_ID=node_b
      - VALIDATOR_PRIVATE_KEY=${NODE_B_PRIVATE_KEY}
      - VALIDATOR_PUBLIC_KEYS=${VALIDATOR_PUBLIC_KEYS}
      - SERVER_SIGN_PRIVATE_KEY=${NODE_B_PRIVATE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ELIXIR_HOST=node_b
      - ELIXIR_HTTP_PORT=6000
    volumes:
      - bis_data_b:/data # volume univoco per il nodo B
    ports:
      - "8002:8000"
    restart: unless-stopped
    networks:
      node_b_internal:
        aliases:
          - python_validator
      cluster_network:

  node_b:
    build: ./Server_MessagerNode
    environment:
      - NODE_ID=node_b
      - PYTHON_HOST=python_validator
      - PYTHON_PORT=8000 
      - ELIXIR_HTTP_PORT=6000
      - PEERS=node_a:4000,node_c:4000,node_d:4000
    depends_on:
      - python_validator_b
    restart: unless-stopped
    networks:
      - node_b_internal
      - cluster_network


  # NODO C (Onesto)
  python_validator_c:
    build: 
      context: ./Server_Python
    container_name: bis_api_server_c # Nome univoco
    env_file:
      - ./.env
      - ./Server_Python/.env
    environment:
      - NODE_ID=node_c
      - VALIDATOR_PRIVATE_KEY=${NODE_C_PRIVATE_KEY}
      - VALIDATOR_PUBLIC_KEYS=${VALIDATOR_PUBLIC_KEYS}
      - SERVER_SIGN_PRIVATE_KEY=${NODE_C_PRIVATE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ELIXIR_HOST=node_c
      - ELIXIR_HTTP_PORT=6000
    volumes:
      - bis_data_c:/data # volume univoco per il nodo C
    ports:
      - "8003:8000"
    restart: unless-stopped
    networks:
      node_c_internal:
        aliases:
          - python_validator
      cluster_network:

  node_c:
    build: ./Server_MessagerNode
    environment:
      - NODE_ID=node_c
      - PYTHON_HOST=python_validator
      - PYTHON_PORT=8000
      - ELIXIR_HTTP_PORT=6000
      - PEERS=node_a:4000,node_b:4000,node_d:4000
    depends_on:
      - python_validator_c
    restart: unless-stopped
    networks:
      - node_c_internal
      - cluster_network


  # NODO D (fault injection via simbehaviour endpoints at runtime)
  python_validator_d:
    build: 
      context: ./Server_Python
    container_name: bis_api_server_d # Nome univoco
    env_file:
      - ./.env
      - ./Server_Python/.env
    environment:
      - NODE_ID=node_d
      - VALIDATOR_PRIVATE_KEY=${NODE_D_PRIVATE_KEY}
      - VALIDATOR_PUBLIC_KEYS=${VALIDATOR_PUBLIC_KEYS}
      - SERVER_SIGN_PRIVATE_KEY=${NODE_D_PRIVATE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ELIXIR_HOST=node_d
      - ELIXIR_HTTP_PORT=6000
      - BIZANTINE_SCENARIO=${BIZANTINE_SCENARIO:-invalid_signature}
    volumes:
      - bis_data_d:/data # volume univoco per il nodo D
    ports:
      - "8004:8000"
    restart: unless-stopped
    networks:
      node_d_internal:
        aliases:
          - python_validator
      cluster_network:

  node_d:
    build: ./Server_MessagerNode
    environment:
      - NODE_ID=node_d
      - PYTHON_HOST=python_validator
      - PYTHON_PORT=8000
      - ELIXIR_HTTP_PORT=6000
      - BIZANTINE_SCENARIO=${BIZANTINE_SCENARIO:-invalid_signature}
      - PEERS=node_a:4000,node_b:4000,node_c:4000
    depends_on:
      - python_validator_d
    restart: unless-stopped
    networks:
      - node_d_internal
      - cluster_network