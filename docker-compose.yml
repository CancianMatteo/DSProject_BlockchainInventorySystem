

# reti separate per ogni nodo
networks:
  cluster_network:
    driver: bridge
  node_a_internal:
    internal: true
  node_b_internal:
    internal: true
  node_c_internal:
    internal: true
  node_d_internal:
    internal: true

# volumi separati per evitare conflitti nel DB SQLite
volumes:
  bis_data_a:
  bis_data_b:
  bis_data_c:
  bis_data_d:

services:
 
 # NODO A (Onesto)

  python_validator_a:
    build: 
      context: ./Server_Python
    container_name: bis_api_server_a # Nome univoco
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file:
      - ./Server_Python/.env 
    environment:
      - ELIXIR_HOST=node_a
      - ELIXIR_HTTP_PORT=6001
    volumes:
      - bis_data_a:/data # volume univoco per il nodo A
    ports:
      - "5001:8000" # Porta host univoca
    restart: unless-stopped
    networks:
      node_a_internal:
        aliases:
          - python_validator

  node_a:
    build: ./Server_MessagerNode
    environment:
      - NODE_ID=node_a
      - PYTHON_HOST=python_validator 
      - PYTHON_PORT=8000 
      - ELIXIR_HTTP_PORT=6001
      - PEERS=node_b:4000,node_c:4000,node_d:4000
    depends_on:
      - python_validator_a
    restart: unless-stopped
    networks:
      - node_a_internal
      - cluster_network
    ports:
      - "4001:4000"
      - "6001:6001"


 
  # NODO B (Onesto)

  python_validator_b:
    build: 
      context: ./Server_Python
    container_name: bis_api_server_b # Nome univoco
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file:
      - ./Server_Python/.env 
    environment:
      - ELIXIR_HOST=node_b
      - ELIXIR_HTTP_PORT=6002
    volumes:
      - bis_data_b:/data # volume univoco per il nodo B
    ports:
      - "5002:8000" # Porta host univoca
    restart: unless-stopped
    networks:
      node_b_internal:
        aliases:
          - python_validator

  node_b:
    build: ./Server_MessagerNode
    environment:
      - NODE_ID=node_b
      - PYTHON_HOST=python_validator
      - PYTHON_PORT=8000 
      - ELIXIR_HTTP_PORT=6002
      - PEERS=node_a:4000,node_c:4000,node_d:4000
    depends_on:
      - python_validator_b
    restart: unless-stopped
    networks:
      - node_b_internal
      - cluster_network
    ports:
      - "4002:4000"
      - "6002:6002"



  # NODO C (Onesto)
  
  python_validator_c:
    build: 
      context: ./Server_Python
    container_name: bis_api_server_c # Nome univoco
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file:
      - ./Server_Python/.env 
    environment:
      - ELIXIR_HOST=node_c
      - ELIXIR_HTTP_PORT=6003
    volumes:
      - bis_data_c:/data # volume univoco per il nodo C
    ports:
      - "5003:8000" # Porta host univoca
    restart: unless-stopped
    networks:
      node_c_internal:
        aliases:
          - python_validator

  node_c:
    build: ./Server_MessagerNode
    environment:
      - NODE_ID=node_c
      - PYTHON_HOST=python_validator
      - PYTHON_PORT=8000
      - ELIXIR_HTTP_PORT=6003
      - PEERS=node_a:4000,node_b:4000,node_d:4000
    depends_on:
      - python_validator_c
    restart: unless-stopped
    networks:
      - node_c_internal
      - cluster_network
    ports:
      - "4003:4000"
      - "6003:6003"



  # NODO D (fault injection via simbehaviour endpoints at runtime)
 
  python_validator_d:
    build: 
      context: ./Server_Python
    container_name: bis_api_server_d # Nome univoco
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file:
      - ./Server_Python/.env 
    environment:
      - ELIXIR_HOST=node_d
      - ELIXIR_HTTP_PORT=6004
    volumes:
      - bis_data_d:/data # volume univoco per il nodo D
    ports:
      - "5004:8000" # Porta host univoca
    restart: unless-stopped
    networks:
      node_d_internal:
        aliases:
          - python_validator

  node_d:
    build: ./Server_MessagerNode
    environment:
      - NODE_ID=node_d
      - PYTHON_HOST=python_validator
      - PYTHON_PORT=8000
      - ELIXIR_HTTP_PORT=6004
      - PEERS=node_a:4000,node_b:4000,node_c:4000
    depends_on:
      - python_validator_d
    restart: unless-stopped
    networks:
      - node_d_internal
      - cluster_network
    ports:
      - "4004:4000"
      - "6004:6004"
      - cluster_network