version: '3.8'

services:


  node_a:
    python_validator:
      build: 
        context: ./python_service # servizio python
      ports:
        - "5001:5001"
    build: .
    environment:
      - NODE_ID=node_a
      # python_validator è il nome del servizio python_validator definito sopra
      - PYTHON_HOST=python_validator 
      - PYTHON_PORT=5001
      - MY_PORT=4001
      - PEERS=node_b:4002,node_c:4003,node_d:4004
    ports:
      - "4001:4000"
      - "5001:5000"
    depends_on:
      - python_validator

  node_b:
    build: .
    environment:
      - NODE_ID=node_b
      - PYTHON_HOST=python_validator
      - PYTHON_PORT=5002
      - MY_PORT=4002
      - PEERS=node_a:4001,node_c:4003,node_d:4004
    ports:
      - "4002:4002"
    depends_on:
      - python_validator

  node_c:
    build: .
    environment:
      - NODE_ID=node_c
      - PYTHON_HOST=python_validator
      - PYTHON_PORT=5003
      - MY_PORT=4003
      - PEERS=node_a:4001,node_b:4002,node_d:4004
    ports:
      - "4003:4003"
    depends_on:
      - python_validator
      
  node_d:
    build: .
    environment:
      - NODE_ID=node_d
      - PYTHON_HOST=python_validator
      - PYTHON_PORT=5004
      - MY_PORT=4004
      - PEERS=node_a:4001,node_b:4002,node_c:4003
    ports:
      - "4004:4004"
    depends_on:
      - python_validator