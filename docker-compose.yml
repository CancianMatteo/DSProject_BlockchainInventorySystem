version: '3.8'

# reti separate per ogni nodo
networks:
  cluster_network:
    driver: bridge
  node_a_internal:
    internal: true
  node_b_internal:
    internal: true
  node_c_internal:
    internal: true
  node_d_internal:
    internal: true

# volumi separati per evitare conflitti nel DB SQLite
volumes:
  bis_data_a:
  bis_data_b:
  bis_data_c:
  bis_data_d:

services:
 
 # NODO A (Onesto)

  python_validator_a:
    build: 
      context: ./Server_Backend
    container_name: bis_api_server_a # Nome univoco
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file:
      - ./Server_Backend/.env 
    volumes:
      - bis_data_a:/data # volume univoco per il nodo A
    ports:
      - "5001:8000" # Porta host univoca
    restart: unless-stopped
    networks:
      node_a_internal:
        aliases:
          - python_validator

  node_a:
    build: ./Server_Interface/Server_Interface
    environment:
      - NODE_ID=node_a
      - BYZANTINE_MODE=false
      - PYTHON_HOST=python_validator 
      - PYTHON_PORT=8000 
      - PEERS=node_b:4000,node_c:4000,node_d_byzantine:4000
    depends_on:
      - python_validator_a
    restart: unless-stopped
    networks:
      - node_a_internal
      - cluster_network


 
  # NODO B (Onesto)

  python_validator_b:
    build: 
      context: ./Server_Backend
    container_name: bis_api_server_b # Nome univoco
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file:
      - ./Server_Backend/.env 
    volumes:
      - bis_data_b:/data # volume univoco per il nodo B
    ports:
      - "5002:8000" # Porta host univoca
    restart: unless-stopped
    networks:
      node_b_internal:
        aliases:
          - python_validator

  node_b:
    build: ./Server_Interface/Server_Interface
    environment:
      - NODE_ID=node_b
      - BYZANTINE_MODE=false
      - PYTHON_HOST=python_validator
      - PYTHON_PORT=8000 
      - PEERS=node_a:4000,node_c:4000,node_d_byzantine:4000
    depends_on:
      - python_validator_b
    restart: unless-stopped
    networks:
      - node_b_internal
      - cluster_network



  # NODO C (Onesto)
  
  python_validator_c:
    build: 
      context: ./Server_Backend
    container_name: bis_api_server_c # Nome univoco
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file:
      - ./Server_Backend/.env 
    volumes:
      - bis_data_c:/data # volume univoco per il nodo C
    ports:
      - "5003:8000" # Porta host univoca
    restart: unless-stopped
    networks:
      node_c_internal:
        aliases:
          - python_validator

  node_c:
    build: ./Server_Interface/Server_Interface
    environment:
      - NODE_ID=node_c
      - BYZANTINE_MODE=false
      - PYTHON_HOST=python_validator
      - PYTHON_PORT=8000
      - PEERS=node_a:4000,node_b:4000,node_d_byzantine:4000
    depends_on:
      - python_validator_c
    restart: unless-stopped
    networks:
      - node_c_internal
      - cluster_network



  # NODO D (BIZANTINO)
 
  python_validator_d:
    build: 
      context: ./Server_Backend
    container_name: bis_api_server_d # Nome univoco
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file:
      - ./Server_Backend/.env 
    volumes:
      - bis_data_d:/data # volume univoco per il nodo D
    ports:
      - "5004:8000" # Porta host univoca
    restart: unless-stopped
    networks:
      node_d_internal:
        aliases:
          - python_validator

  node_d_byzantine:
    build: ./Server_Interface/Server_Interface
    environment:
      - NODE_ID=node_d_byzantine
      - BYZANTINE_MODE=true 
      - PYTHON_HOST=python_validator
      - PYTHON_PORT=8000
      - PEERS=node_a:4000,node_b:4000,node_c:4000
    depends_on:
      - python_validator_d
    restart: unless-stopped
    networks:
      - node_d_internal
      - cluster_network